[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fetchtune"
version = "0.3.1"
description = "Universal music metadata resolver for Python"
readme = "README.md"
requires-python = ">=3.10"

license = { text = "MIT" }

authors = [
    { name = "Mohammad Reza Maleki" }
]

keywords = [
    "music",
    "metadata",
    "music-metadata",
    "spotify",
    "apple-music",
    "resolver",
    "music-resolver",
    "track",
    "album",
    "artist"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",

    "License :: OSI Approved :: MIT License",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/momalekiii/fetchtune"
Repository = "https://github.com/momalekiii/fetchtune"
Issues = "https://github.com/momalekiii/fetchtune/issues"

[project.optional-dependencies]
# `pip install fetchtune[downloader]` — enables `fetchtune download`
# (the core library stays dependency-free)
downloader = [
    "yt-dlp>=2025.1.1",
    "mutagen>=1.47",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
fetchtune = "fetchtune.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
